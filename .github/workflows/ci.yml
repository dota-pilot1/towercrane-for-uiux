name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - "towercrane-for-uiux-front/**"
      - "towercrane-for-uiux-server/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - "towercrane-for-uiux-front/**"
      - "towercrane-for-uiux-server/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: towercrane-for-uiux-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: towercrane-for-uiux-front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.hibot-docu.com/api' }}
        run: pnpm build
