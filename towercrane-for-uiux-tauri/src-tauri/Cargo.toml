[package]
name = "towercrane-for-uiux-tauri"
version = "0.1.0"
description = "프로젝트 업무 관리 메신저"
authors = ["you"]
edition = "2021"

[lib]
name = "towercrane_for_uiux_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
